# Luckfox Distro
#
# sources/yocto-docs/documentation/dev-manual/custom-distribution.rst

DISTRO = "luckfox"
DISTRO_NAME = "Luckfox Linux"
# TODO: populate this from git repo version
DISTRO_VERSION = "v0.1.0"
DISTRO_CODENAME = "wrynose"
SDK_VENDOR = "-luckfoxsdk"
SDK_VERSION = "${DISTRO_VERSION}"

TARGET_VENDOR = "-luckfox"

TCLIBC = "glibc"
INIT_MANAGER = "systemd"

# Audio through the on-SoC codec
DISTRO_FEATURES = "alsa"
# SKI.WB800DCS module: Bluetooth over UART1_M0
DISTRO_FEATURES += "bluetooth"
# ext2/3/4 root filesystem on the eMMC
DISTRO_FEATURES += "ext2"
# Networking over Ethernet and Wi-Fi
DISTRO_FEATURES += "ipv4 ipv6"
# Large file support
DISTRO_FEATURES += "largefile"
# Seccomp filtering for systemd services
DISTRO_FEATURES += "seccomp"
# USB Type-C port as device/OTG
DISTRO_FEATURES += "usbgadget"
# USB Type-A port as host
DISTRO_FEATURES += "usbhost"
# FAT support for the vendor update flow
DISTRO_FEATURES += "vfat"
# SKI.WB800DCS module: Wi-Fi over SDIO
DISTRO_FEATURES += "wifi"
# Extended attributes on the root filesystem
DISTRO_FEATURES += "xattr"

PACKAGE_CLASSES ?= "package_rpm"
