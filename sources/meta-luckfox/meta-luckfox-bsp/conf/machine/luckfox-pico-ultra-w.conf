#@TYPE: Machine
#@NAME: Luckfox Pico Ultra W
#@DESCRIPTION: Machine configuration for the Luckfox Pico Ultra W (Rockchip RV1106G3, 8GB eMMC, SDIO Wi-Fi/BT)

require conf/machine/include/rv1106.inc

# Debug UART: UART2_M1 (GPIO1_B2 TX / GPIO1_B3 RX), routed to header P1
SERIAL_CONSOLES ?= "115200;ttyFIQ0 115200;ttyS2"

# On-SoC audio codec: on-board mic (MIC0), MIC1 on header, line out amplifier
MACHINE_FEATURES = "alsa"
# SKI.WB800DCS module: Bluetooth over UART1_M0
MACHINE_FEATURES += "bluetooth"
# ext2/3/4 tools for the root filesystem on the 8GB eMMC
MACHINE_FEATURES += "ext2"
# On-SoC RTC with 32.768kHz crystal (Y2)
MACHINE_FEATURES += "rtc"
# RGB666 LCD on the 40-pin FPC (H2)
MACHINE_FEATURES += "screen"
# Debug UART2_M1 on the GPIO header
MACHINE_FEATURES += "serial"
# USB Type-C port (H5) as device/OTG
MACHINE_FEATURES += "usbgadget"
# USB Type-A port (J2) as host, through the USB switch (U10)
MACHINE_FEATURES += "usbhost"
# FAT support: vendor SD/TFTP update flow loads images with fatload
MACHINE_FEATURES += "vfat"
# SKI.WB800DCS module: Wi-Fi over SDIO on SDMMC
MACHINE_FEATURES += "wifi"

# TODO: provide RV1106 capable kernel and bootloader recipes
PREFERRED_PROVIDER_virtual/kernel ?= "linux-yocto"
PREFERRED_PROVIDER_virtual/bootloader ?= "u-boot"
KERNEL_DEVICETREE ?= "rockchip/rv1106g-luckfox-pico-ultra-w.dtb"

IMAGE_FSTYPES += "tar.zst ext4"
