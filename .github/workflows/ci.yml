name: CI

# Security model (public repo + self-hosted runner):
# - Only push events trigger CI. No pull_request/pull_request_target, so forks
#   can never schedule work on the self-hosted runner.
# - Every job is gated on the owner being both the actor and triggering actor,
#   so re-runs by anyone else are skipped too.
# - The self-hosted build job has a read-only token and no persisted
#   credentials. Only the GitHub-hosted publish job gets contents: write.
# - Untrusted values (ref names) only reach shell via env, never ${{ }} in run.
# - Third party actions are pinned by commit SHA.
#
# Modes:
# - review:  any push that is not an annotated v* tag. Reuses DL_DIR and
#            SSTATE_DIR from the runner environment.
# - release: an annotated v* tag. Reuses DL_DIR, builds from an empty
#            sstate-cache, and publishes a GitHub release.
#
# Every build is packaged with cqfd --release and uploaded as a workflow
# artefact for 7 days: meta_luckfox-<git describe> for review, release for
# release. Download with: gh run download <run-id>
#
# Every build is followed by a yocto-check-layer stage. A release is only
# published once both the build and the layer check have passed.
#
# TODO: require signed release tags and verify them with git verify-tag in
#       classify and publish.

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions: {}

concurrency:
  # Review builds on the same branch supersede each other; releases never do
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  classify:
    name: Classify
    if: >-
      github.repository == 'anakin4747/meta-luckfox' &&
      github.actor == 'anakin4747' &&
      github.triggering_actor == 'anakin4747'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      tag: ${{ steps.mode.outputs.tag }}
    steps:
      - name: Determine build mode
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            printf "mode=review\n" >> "$GITHUB_OUTPUT"
            printf "tag=\n" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! printf "%s" "$REF_NAME" |
            grep --quiet --extended-regexp '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'
          then
            printf "::error::tag %s is not a vX.Y.Z version\n" "$REF_NAME"
            exit 1
          fi

          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$REF_NAME") || exit 1
          type=$(printf "%s" "$ref" | jq --raw-output .object.type) || exit 1
          if [ "$type" != "tag" ]; then
            printf "::error::tag %s is not annotated (got %s)\n" "$REF_NAME" "$type"
            exit 1
          fi

          tag_sha=$(printf "%s" "$ref" | jq --raw-output .object.sha) || exit 1
          target=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" \
            --jq '.object.type + " " + .object.sha') || exit 1
          if [ "$target" != "commit $GITHUB_SHA" ]; then
            printf "::error::tag %s points at %s, expected commit %s\n" \
              "$REF_NAME" "$target" "$GITHUB_SHA"
            exit 1
          fi

          printf "mode=release\n" >> "$GITHUB_OUTPUT"
          printf "tag=%s\n" "$REF_NAME" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ needs.classify.outputs.mode }})
    needs: classify
    if: >-
      github.repository == 'anakin4747/meta-luckfox' &&
      github.actor == 'anakin4747' &&
      github.triggering_actor == 'anakin4747'
    runs-on: [self-hosted, linux, yocto]
    timeout-minutes: 1440
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          clean: true

      - name: Build
        id: build
        env:
          BUILD_MODE: ${{ needs.classify.outputs.mode }}
        run: make build

      - name: Upload review artefacts
        if: needs.classify.outputs.mode == 'review'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meta_luckfox-${{ steps.build.outputs.version }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ steps.build.outputs.archive }}
            ${{ steps.build.outputs.archive }}.sha256

      - name: Upload release artefacts
        if: needs.classify.outputs.mode == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ steps.build.outputs.archive }}
            ${{ steps.build.outputs.archive }}.sha256
            CHANGELOG-release.md

  layer-check:
    name: Layer check (${{ needs.classify.outputs.mode }})
    needs: [classify, build]
    if: >-
      needs.build.result == 'success' &&
      github.repository == 'anakin4747/meta-luckfox' &&
      github.actor == 'anakin4747' &&
      github.triggering_actor == 'anakin4747'
    runs-on: [self-hosted, linux, yocto]
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          clean: true

      - name: Layer check
        run: make layer-check

  publish:
    name: Publish release
    needs: [classify, build, layer-check]
    if: >-
      needs.classify.outputs.mode == 'release' &&
      needs.build.result == 'success' &&
      needs.layer-check.result == 'success' &&
      github.repository == 'anakin4747/meta-luckfox' &&
      github.actor == 'anakin4747' &&
      github.triggering_actor == 'anakin4747'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release artefacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Verify tag is unchanged
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.classify.outputs.tag }}
        run: |
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
            --jq 'select(.object.type == "tag") | .object.sha') || exit 1
          if [ -z "$tag_sha" ]; then
            printf "::error::tag %s is missing or not annotated\n" "$TAG"
            exit 1
          fi
          target=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" \
            --jq '.object.sha') || exit 1
          if [ "$target" != "$GITHUB_SHA" ]; then
            printf "::error::tag %s moved to %s, built %s\n" "$TAG" "$target" "$GITHUB_SHA"
            exit 1
          fi

      - name: Verify checksum
        working-directory: release
        env:
          TAG: ${{ needs.classify.outputs.tag }}
        run: sha256sum --check --strict "meta_luckfox-$TAG.tar.gz.sha256"

      - name: Create GitHub release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.classify.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes-file CHANGELOG-release.md \
            "meta_luckfox-$TAG.tar.gz" \
            "meta_luckfox-$TAG.tar.gz.sha256"
