header:
  version: 14

distro: luckfox
machine: luckfox-pico-ultra-w
target: luckfox-image

env:
  CI_VERSION: "unknown"

local_conf_header:
  hashserve: |
    BB_HASHSERVE_DB_DIR = "${SSTATE_DIR}"

defaults:
  repos:
    branch: wrynose

repos:
  bitbake:
    url: https://git.openembedded.org/bitbake
    branch: "2.18"
    path: sources/bitbake
    layers:
      .: disabled

  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    path: sources/openembedded-core
    layers:
      meta:

  yocto-docs:
    url: https://git.yoctoproject.org/yocto-docs
    path: sources/yocto-docs
    layers:
      .: disabled

  meta-luckfox-bsp:
    path: sources/meta-luckfox/meta-luckfox-bsp

  meta-luckfox-distro:
    path: sources/meta-luckfox/meta-luckfox-distro

